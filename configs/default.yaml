# Quantum-effort-estimation config. Mirrors btoe where practical.

data:
  # btoe two-file layout: features parquet has only feature columns;
  # the target lives in a raw issue/PR parquet aligned by row index.
  # Set raw_path to null when features parquet contains the target itself
  # (e.g. the synthetic demo).
  path: data/nlp_features.parquet
  raw_path: data/issue_pr_pairs.parquet
  target: duration_hours
  embedding_prefix: emb_
  # Mirrors btoe's filtering.{min_duration_hours, max_duration_days}.
  min_duration_hours: 1
  max_duration_days: 90

split:
  test_size: 0.2
  random_seed: 42

preprocessing:
  # Two-stage compression to fit the qubit budget. btoe's first-stage PCA
  # produced 50 dims; this parquet still has the raw 768 CodeBERT dims plus
  # 6 derived features, so the PCA below absorbs both stages at once.
  n_qubits: 8
  log_transform_target: true   # duration_hours is heavy-tailed; log1p target
  scale_features: true          # MinMax [0, pi] for angle encoding

quantum:
  feature_map:
    kind: zz                    # zz | pauli
    reps: 2
    entanglement: linear
  ansatz:
    kind: real_amplitudes       # real_amplitudes | efficient_su2
    reps: 3
    entanglement: linear
  vqr:
    optimizer: cobyla
    maxiter: 150
    initial_point: null         # null = random
  qkrr:
    alpha: 1.0                  # ridge regularisation
    shots: 1024

classical:
  xgboost:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0

evaluation:
  metrics: [mae, mdae, mmre, pred_25, pred_50, r2, sa]
  wilcoxon_alpha: 0.05
